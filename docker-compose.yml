# docker-compose.yml - Ethercloud ERP - OVHcloud VPS con Coolify
# Este archivo es para referencia local. En Coolify se configuran los servicios individuales.
# Si prefieres desplegar con docker-compose en el VPS directamente, usa este archivo.

version: "3.8"

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: ethercloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ethercloud_erp
      POSTGRES_USER: ethercloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethercloud -d ethercloud_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ethercloud-network

  # ==================== Backend (FastAPI) ====================
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: ethercloud-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ethercloud:${DB_PASSWORD:-changeme_in_production}@postgres:5432/ethercloud_erp
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET con un valor aleatorio (openssl rand -hex 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-12}
      LAB_MARGEN_GANANCIA: ${LAB_MARGEN_GANANCIA:-0.30}
      # Procesos de API (~150 MB c/u)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      PORT: 8000
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - ethercloud-network

  # ==================== Frontend (React) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8000}
        REACT_APP_CIUDAD_FACTURA: ${REACT_APP_CIUDAD_FACTURA:-Ciudad del Este}
    container_name: ethercloud-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - ethercloud-network

volumes:
  pgdata:
    driver: local
  backend-uploads:
    driver: local

networks:
  ethercloud-network:
    driver: bridge
